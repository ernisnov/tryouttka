                      Belum ada soal pada paket ini.
                    </div>
                  ) : (
                    filteredQuestions.map((q, idx) => (
                      <div key={q.id} className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
                        <div className="flex items-start justify-between gap-3 mb-2">
                          <div className="flex items-center gap-2">
                            <span className="px-2.5 py-1 rounded-lg bg-slate-900 text-white text-xs font-extrabold">No. {idx + 1}</span>
                            <span className="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 text-xs font-bold">{q.type}</span>
                          </div>
                          <div className="flex items-center gap-1.5">
                            <button
                              onClick={() => {
                                setQForm({
                                  ...q,
                                  options: q.options && q.options.length ? [...q.options] : ["", "", "", ""],
                                  matchingPairs: q.matchingPairs && q.matchingPairs.length ? [...q.matchingPairs] : [{ id: "m1", left: "", right: "" }],
                                  surveyWeights: q.surveyWeights && q.surveyWeights.length ? [...q.surveyWeights] : [4, 3, 2, 1]
                                });
                                setShowQModal(true);
                              }}
                              className="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700"
                            >
                              <Icon name="edit" className="w-4 h-4" />
                            </button>
                            <button
                              onClick={async () => {
                                await CloudSync.removeItem("questions", q.id);
                                await refreshLocal();
                                notify("Soal dihapus.");
                              }}
                              className="p-2 rounded-lg bg-red-50 hover:bg-red-100 text-red-600"
                            >
                              <Icon name="trash" className="w-4 h-4" />
                            </button>
                          </div>
                        </div>

                        {q.image && <img src={q.image} alt="" className="max-h-40 rounded-lg mb-3 border" />}
                        <div className="text-sm text-slate-800 whitespace-pre-line mb-3">
                          <MathText text={q.text} />
                        </div>

                        {(q.type === "PG" || q.type === "PGK" || q.type === "SURVEI") && (
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                            {(q.options || []).map((opt, oIdx) => {
                              const isKey = (q.correctAnswer || []).includes(oIdx);
                              return (
                                <div key={oIdx} className={`p-2.5 rounded-lg border ${isKey ? "bg-emerald-50 border-emerald-300 font-bold text-emerald-900" : "bg-slate-50 border-slate-200 text-slate-700"}`}>
                                  <span className="mr-1.5 font-extrabold">{String.fromCharCode(65 + oIdx)}.</span>
                                  <MathText text={opt} />
                                  {q.type === "SURVEI" && (
                                    <span className="ml-2 text-purple-700 font-bold">(Skor: {(q.surveyWeights || [])[oIdx] ?? 0})</span>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        )}

                        {q.type === "MENJODOHKAN" && (
                          <div className="space-y-1.5 text-xs">
                            {(q.matchingPairs || []).map((p, pIdx) => (
                              <div key={pIdx} className="p-2 rounded-lg bg-slate-50 border border-slate-200 flex items-center gap-2">
                                <MathText text={p.left} />

                )}

                <div className="flex justify-end gap-2 pt-3 border-t">
                  <button type="button" onClick={() => setShowQModal(false)} className="px-4 py-2 rounded-xl border border-slate-300 text-sm font-bold">Batal</button>
                  <button type="submit" className="px-5 py-2 rounded-xl bg-blue-700 text-white text-sm font-bold">Simpan Soal</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL TAMBAH / EDIT PENGGUNA */}
          {showUserModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <form onSubmit={saveUser} className="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
                <h3 className="text-lg font-extrabold text-slate-900">{userForm.id ? "Edit Pengguna" : "Tambah Pengguna"}</h3>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-600 mb-1">NISN / Username</label>
                  <input type="text" required value={userForm.username} onChange={(e) => setUserForm({ ...userForm, username: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Nama Lengkap</label>
                  <input type="text" required value={userForm.name} onChange={(e) => setUserForm({ ...userForm, name: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Kelas</label>
                    <input type="text" value={userForm.kelas} onChange={(e) => setUserForm({ ...userForm, kelas: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Password</label>
                    <input type="text" required value={userForm.password} onChange={(e) => setUserForm({ ...userForm, password: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowUserModal(false)} className="px-4 py-2 rounded-xl border border-slate-300 text-sm font-bold">Batal</button>
                  <button type="submit" className="px-5 py-2 rounded-xl bg-blue-700 text-white text-sm font-bold">Simpan</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL DETAIL ANALISIS HASIL PESERTA (TANPA TOMBOL CETAK) */}
          {detailModalResult && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-3xl rounded-2xl p-6 shadow-2xl max-h-[88vh] flex flex-col">
                <div className="flex items-start justify-between gap-3 pb-4 border-b border-slate-200">
                  <div>
                    <h3 className="text-lg font-extrabold text-slate-900">Detail Analisis Jawaban Peserta</h3>
                    <p className="text-xs text-slate-600 mt-0.5">
                      <strong>{detailModalResult.userName}</strong> ({detailModalResult.kelas}) — {detailModalResult.packageTitle}
                    </p>
                  </div>
                  <button onClick={() => setDetailModalResult(null)} className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto py-4 space-y-3">
                  {(detailModalResult.details || []).map((d, i) => (
                    <div key={i} className={`p-4 rounded-xl border ${d.isCorrect ? "bg-emerald-50/50 border-emerald-200" : "bg-red-50/40 border-red-200"}`}>
                      <div className="flex items-center justify-between gap-2 mb-1.5">
                        <span className="text-xs font-extrabold text-slate-800">Soal No. {d.no} ({d.type})</span>
                        <span className={`px-2 py-0.5 rounded text-xs font-bold ${d.isCorrect ? "bg-emerald-600 text-white" : "bg-red-600 text-white"}`}>
                          {d.status}
                        </span>
                      </div>
                      <div className="text-xs text-slate-700 mb-2 whitespace-pre-line">
                        <MathText text={d.text} />
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                        <div className="p-2 rounded-lg bg-white border border-slate-200">
                          <span className="text-slate-400 block">Jawaban Peserta:</span>
                          <span className="font-bold text-slate-800"><MathText text={d.studentAnswerText} /></span>
                        </div>
                        <div className="p-2 rounded-lg bg-white border border-slate-200">
                          <span className="text-slate-400 block">Kunci / Acuan:</span>
                          <span className="font-bold text-emerald-700"><MathText text={d.correctAnswerText} /></span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="pt-3 border-t border-slate-200 flex items-center justify-between">
                  <span className="text-sm font-extrabold text-blue-700">
                    {detailModalResult.packageCategory === "SURVEI"
                      ? `Total Skor Survei: ${detailModalResult.score} / ${detailModalResult.maxScore}`
                      : `Nilai Akhir: ${detailModalResult.score}`}
                  </span>
                  <button
                    onClick={() => setDetailModalResult(null)}
                    className="px-5 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold"
                  >
                    Tutup Detail
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // 11. ROOT KOMPONEN APLIKASI
    // =========================================================================
    const App = () => {
      const [booting, setBooting] = useState(true);
      const [currentUser, setCurrentUser] = useState(null);
      const [syncStatus, setSyncStatus] = useState("local");
      const [config, setConfig] = useState(SEED_CONFIG);

      const performSync = useCallback(async (silent = false) => {
        const result = await CloudSync.pullAllFromCloud();
        setSyncStatus(result.synced ? "cloud" : "local");
        const savedCfg = await AsyncDB.get("settings", "app_config");
        if (savedCfg) setConfig(savedCfg);
        return result;
      }, []);

      useEffect(() => {
        (async () => {
          await performSync(true);
          setBooting(false);
        })();
      }, [performSync]);

      if (booting) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-900 text-white">
            <div className="text-center">
              <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
              <p className="text-sm font-bold tracking-wide">Menyinkronkan Database Ujian...</p>
            </div>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <LoginView
            config={config}
            syncStatus={syncStatus}
            onRefreshSync={performSync}
            onLogin={setCurrentUser}
          />
        );
      }

      if (currentUser.role === "admin") {
        return (
          <AdminDashboard
            user={currentUser}
            config={config}
            syncStatus={syncStatus}
            onRefreshSync={performSync}
            onConfigUpdate={setConfig}
            onLogout={() => setCurrentUser(null)}
          />
        );
      }

      return (
        <StudentDashboard
          user={currentUser}
          config={config}
          syncStatus={syncStatus}
          onRefreshSync={performSync}
          onLogout={() => setCurrentUser(null)}
        />
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
