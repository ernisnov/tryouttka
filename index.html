    // 2. INDEXEDDB ENGINE (AsyncDB) - CACHE OFFLINE PERMANEN
    // =========================================================================
    const DB_NAME = "TKA_SMPN5_Sajira_HybridDB";
    const DB_VERSION = 1;
    const STORES = ["users", "packages", "questions", "sessions", "results", "settings"];

    const AsyncDB = {
      _db: null,
      async open() {
        if (this._db) return this._db;
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            STORES.forEach((s) => {
              if (!db.objectStoreNames.contains(s)) {
                db.createObjectStore(s, { keyPath: "id" });
              }
            });
          };
          req.onsuccess = (e) => {
            this._db = e.target.result;
            resolve(this._db);
          };
          req.onerror = (e) => reject(e.target.error);
        });
      },
      async getAll(store) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(store, "readonly");
          const req = tx.objectStore(store).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      },
      async get(store, id) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(store, "readonly");
          const req = tx.objectStore(store).get(id);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      },
      async put(store, item) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(store, "readwrite");
          const req = tx.objectStore(store).put(item);
          req.onsuccess = () => resolve(item);
          req.onerror = () => reject(req.error);
        });
      },
      async bulkPut(store, items) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(store, "readwrite");
          const os = tx.objectStore(store);
          items.forEach((item) => os.put(item));
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      },
      async delete(store, id) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(store, "readwrite");
          const req = tx.objectStore(store).delete(id);
          req.onsuccess = () => resolve(true);
          req.onerror = () => reject(req.error);
        });
      },
      async clear(store) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(store, "readwrite");
          const req = tx.objectStore(store).clear();
          req.onsuccess = () => resolve(true);
          req.onerror = () => reject(req.error);
        });
      }
    };

    // =========================================================================
    // 4. MESIN SINKRONISASI GOOGLE SHEETS + INDEXEDDB (CloudSync)
    // =========================================================================
    const CloudSync = {
      async postToGas(payload) {
        const url = getGasUrl();
        if (!url) return { status: "local_only" };
        const res = await fetch(url, {
          method: "POST",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        return await res.json();
      },

      async pullAllFromCloud() {
        const url = getGasUrl();
        if (!url) {
          await this.ensureLocalSeed();
          return { synced: false, mode: "local" };
        }

        try {
          // 1. Kirim ulang hasil ujian tertunda jika sebelumnya sempat offline
          const localResults = await AsyncDB.getAll("results");
          const pendingResults = localResults.filter((r) => r.pendingSync);
          if (pendingResults.length > 0) {
            const cleanPending = pendingResults.map(({ pendingSync, ...rest }) => rest);
            const upRes = await this.postToGas({ action: "bulkPut", store: "results", items: cleanPending });
            if (upRes.status === "ok") {
              await AsyncDB.bulkPut("results", cleanPending);
            }
          }

          // 2. Tarik seluruh data terkini dari Google Sheets
          const res = await fetch(`${url}?action=syncAll&t=${Date.now()}`, {
            method: "GET",
            redirect: "follow"
          });
          const json = await res.json();
          if (json.status !== "ok" || !json.data) {
            throw new Error(json.message || "Respon Google Sheets tidak valid");
          }

          const { users = [], packages = [], questions = [], results = [], settings = [] } = json.data;

          // Jika Google Sheets masih kosong pada pemakaian pertama, isi data awal
          if (users.length === 0 && packages.length === 0) {
            await AsyncDB.bulkPut("users", SEED_USERS);
            await AsyncDB.bulkPut("packages", SEED_PACKAGES);
            await AsyncDB.bulkPut("questions", SEED_QUESTIONS);
            await AsyncDB.put("settings", SEED_CONFIG);

            await Promise.all([
              this.postToGas({ action: "bulkPut", store: "users", items: SEED_USERS }),
              this.postToGas({ action: "bulkPut", store: "packages", items: SEED_PACKAGES }),
              this.postToGas({ action: "bulkPut", store: "questions", items: SEED_QUESTIONS }),
              this.postToGas({ action: "put", store: "settings", item: SEED_CONFIG })
            ]);
            return { synced: true, mode: "cloud" };
          }

          // Perbarui cache IndexedDB lokal sesuai data terbaru di Google Sheets
          await Promise.all([
            AsyncDB.clear("users").then(() => users.length && AsyncDB.bulkPut("users", users)),
            AsyncDB.clear("packages").then(() => packages.length && AsyncDB.bulkPut("packages", packages)),
            AsyncDB.clear("questions").then(() => questions.length && AsyncDB.bulkPut("questions", questions)),
            AsyncDB.clear("results").then(() => results.length && AsyncDB.bulkPut("results", results)),
            settings.length ? AsyncDB.bulkPut("settings", settings) : Promise.resolve()
          ]);

          return { synced: true, mode: "cloud" };
        } catch (err) {
          console.warn("Mode offline aktif, menggunakan cache lokal IndexedDB:", err);
          await this.ensureLocalSeed();
          return { synced: false, mode: "offline_fallback", error: err.message };
        }
      },

      async ensureLocalSeed() {
        const cfg = await AsyncDB.get("settings", "app_config");
        if (!cfg) {
          await AsyncDB.bulkPut("users", SEED_USERS);
          await AsyncDB.bulkPut("packages", SEED_PACKAGES);
          await AsyncDB.bulkPut("questions", SEED_QUESTIONS);
          await AsyncDB.put("settings", SEED_CONFIG);
        }
      },

      async saveItem(store, item) {
        await AsyncDB.put(store, item);
        const url = getGasUrl();
        if (!url) return { synced: false, local: true };
        try {
          const { pendingSync, ...cleanItem } = item;
          const res = await this.postToGas({ action: "put", store, item: cleanItem });
          if (res.status === "ok") {
            if (item.pendingSync) await AsyncDB.put(store, cleanItem);
            return { synced: true };
          }
          throw new Error(res.message || "Gagal simpan ke cloud");
        } catch (err) {
          if (store === "results") {
            await AsyncDB.put(store, { ...item, pendingSync: true });
          }
          return { synced: false, error: err.message };
        }
      },

      async saveBulk(store, items) {
        await AsyncDB.bulkPut(store, items);
        const url = getGasUrl();
        if (!url) return { synced: false, local: true };
        try {
          const res = await this.postToGas({ action: "bulkPut", store, items });
          return { synced: res.status === "ok" };
        } catch (err) {
          return { synced: false, error: err.message };
        }
      },

      async removeItem(store, id) {
        await AsyncDB.delete(store, id);
        const url = getGasUrl();
        if (!url) return { synced: false, local: true };
        try {
          const res = await this.postToGas({ action: "delete", store, id });
          return { synced: res.status === "ok" };
        } catch (err) {
          return { synced: false, error: err.message };
        }
      }
    };

    // =========================================================================
    // 5. UTILITAS MATEMATIKA (KaTeX), KOMPRESI GAMBAR & PARSER CSV RFC-4180
    // =========================================================================
    function formatMathHtml(rawText) {
      if (rawText === null || rawText === undefined) return "";
      let text = String(rawText);
      const mathBlocks = [];

      const storeMath = (expr, displayMode) => {
        const idx = mathBlocks.length;
        let rendered = expr;
        try {
          if (window.katex) {
            rendered = window.katex.renderToString(expr.trim(), {
              throwOnError: false,
              displayMode
            });
          } else {
            rendered = `<code class="px-1.5 py-0.5 bg-slate-100 rounded text-blue-700 font-mono text-sm">${expr}</code>`;
          }
        } catch (e) {
          rendered = expr;
        }
        mathBlocks.push(rendered);
        return `@@MATH_${idx}@@`;
      };

      text = text.replace(/\$\$([\s\S]+?)\$\$/g, (_, e) => storeMath(e, true));
      text = text.replace(/\\\[([\s\S]+?)\\\]/g, (_, e) => storeMath(e, true));
      text = text.replace(/\\\(([\s\S]+?)\\\)/g, (_, e) => storeMath(e, false));
      text = text.replace(/\$([^$\n]+?)\$/g, (_, e) => storeMath(e, false));

      text = text.replace(/<br\s*\/?>/gi, "\n");
      text = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      text = text.replace(/\n/g, "<br/>");

      mathBlocks.forEach((html, idx) => {
        text = text.replace(`@@MATH_${idx}@@`, html);
      });
      return text;
    }

    const MathText = ({ text, className = "" }) => {
      const [ready, setReady] = useState(Boolean(window.katex));
      useEffect(() => {
        if (window.katex) { setReady(true); return; }
        const t = setInterval(() => {
          if (window.katex) { setReady(true); clearInterval(t); }
        }, 150);
        return () => clearInterval(t);
      }, []);

      const html = useMemo(() => formatMathHtml(text), [text, ready]);
      return <span className={className} dangerouslySetInnerHTML={{ __html: html }} />;
    };

    function compressImageToDataUrl(file, maxDim = 750, quality = 0.72) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function parseCsvRows(csvText) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;
      const clean = csvText.replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      const firstLine = clean.split("\n")[0] || "";
      const delimiter = firstLine.split(";").length > firstLine.split(",").length ? ";" : ",";

      for (let i = 0; i < clean.length; i++) {
        const c = clean[i];
        const next = clean[i + 1];
        if (c === '"') {
          if (inQuotes && next === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === delimiter && !inQuotes) {
          row.push(field.trim());
          field = "";
        } else if (c === "\n" && !inQuotes) {
          row.push(field.trim());
          if (row.some((cell) => cell !== "")) rows.push(row);
          row = [];
          field = "";
        } else {
          field += c;
        }
      }
      if (field !== "" || row.length > 0) {
        row.push(field.trim());
        if (row.some((cell) => cell !== "")) rows.push(row);
      }
      return rows;
    }

    function parseKeyIndices(rawKey) {
      if (!rawKey) return [];
      const letterMap = { A: 0, B: 1, C: 2, D: 3, E: 4 };
      return String(rawKey)
        .split(/[|,;\s]+/)
        .map((t) => t.trim().toUpperCase())
        .filter(Boolean)
        .map((t) => (letterMap[t] !== undefined ? letterMap[t] : parseInt(t, 10)))
        .filter((n) => !isNaN(n) && n >= 0);
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // =========================================================================
    // 6. MESIN PENILAIAN OTOMATIS (TKA & SURVEI)
    // =========================================================================
    function evaluateExam(questions, answersMap, isSurveyPackage) {
      let totalScore = 0;
      let maxScore = 0;
      let correctCount = 0;
      let wrongCount = 0;
      let blankCount = 0;
      const details = [];

      questions.forEach((q, idx) => {
        const ans = answersMap[q.id];
        if (isSurveyPackage || q.type === "SURVEI") {
          const weights = q.surveyWeights && q.surveyWeights.length ? q.surveyWeights : [4, 3, 2, 1];
          const qMax = Math.max(...weights, 0);
          maxScore += qMax;
          const chosenIdx = typeof ans === "number" ? ans : -1;
          const earned = chosenIdx >= 0 ? Number(weights[chosenIdx] || 0) : 0;
          totalScore += earned;
          if (chosenIdx < 0) blankCount++;
          else correctCount++;

          details.push({
            no: idx + 1,
            questionId: q.id,
            type: q.type,
            text: q.text,
            studentAnswerText: chosenIdx >= 0 ? (q.options[chosenIdx] || `Opsi ${chosenIdx + 1}`) : "(Kosong)",
            correctAnswerText: `Skor Maksimal: ${qMax}`,
            status: chosenIdx >= 0 ? `Skor +${earned}` : "Kosong",
            isCorrect: chosenIdx >= 0,
            earned
          });
          return;
        }

        if (q.type === "PG") {
          const isBlank = ans === undefined || ans === null || ans === "";
          const correctIdx = Array.isArray(q.correctAnswer) ? q.correctAnswer[0] : Number(q.correctAnswer);
          const isRight = !isBlank && Number(ans) === Number(correctIdx);
          if (isBlank) blankCount++;
          else if (isRight) correctCount++;
          else wrongCount++;

          details.push({
            no: idx + 1,
            questionId: q.id,
            type: "PG",
            text: q.text,
            studentAnswerText: !isBlank ? `${String.fromCharCode(65 + Number(ans))}. ${q.options[Number(ans)] || ""}` : "(Kosong)",
            correctAnswerText: `${String.fromCharCode(65 + Number(correctIdx))}. ${q.options[Number(correctIdx)] || ""}`,
            status: isBlank ? "Kosong" : isRight ? "Benar" : "Salah",
            isCorrect: isRight,
            earned: isRight ? 1 : 0
          });
        } else if (q.type === "PGK") {
          const chosen = Array.isArray(ans) ? [...ans].map(Number).sort() : [];
          const keys = Array.isArray(q.correctAnswer) ? [...q.correctAnswer].map(Number).sort() : [];
          const isBlank = chosen.length === 0;
          const isRight = !isBlank && chosen.length === keys.length && chosen.every((v, i) => v === keys[i]);
          if (isBlank) blankCount++;
          else if (isRight) correctCount++;
          else wrongCount++;

          details.push({
            no: idx + 1,
            questionId: q.id,
            type: "PGK",
            text: q.text,
            studentAnswerText: !isBlank ? chosen.map((i) => `${String.fromCharCode(65 + i)}. ${q.options[i] || ""}`).join(" | ") : "(Kosong)",
            correctAnswerText: keys.map((i) => `${String.fromCharCode(65 + i)}. ${q.options[i] || ""}`).join(" | "),
            status: isBlank ? "Kosong" : isRight ? "Benar" : "Salah",
            isCorrect: isRight,
            earned: isRight ? 1 : 0
          });
        } else if (q.type === "MENJODOHKAN") {
          const pairs = q.matchingPairs || [];
          const userPairs = ans && typeof ans === "object" ? ans : {};
          const filledCount = Object.values(userPairs).filter((v) => v !== "" && v !== undefined).length;
          const isBlank = filledCount === 0;
          let matched = 0;
          pairs.forEach((p) => {
            if ((userPairs[p.id] || "").trim() === (p.right || "").trim()) matched++;
          });
          const isRight = !isBlank && pairs.length > 0 && matched === pairs.length;
          if (isBlank) blankCount++;
          else if (isRight) correctCount++;
          else wrongCount++;

          details.push({
            no: idx + 1,
            questionId: q.id,
            type: "MENJODOHKAN",
            text: q.text,
            studentAnswerText: !isBlank ? pairs.map((p) => `${p.left} → ${userPairs[p.id] || "(Belum dipilih)"}`).join(" | ") : "(Kosong)",
            correctAnswerText: pairs.map((p) => `${p.left} → ${p.right}`).join(" | "),
            status: isBlank ? "Kosong" : isRight ? "Benar" : `Salah (${matched}/${pairs.length} cocok)`,
            isCorrect: isRight,
            earned: pairs.length > 0 ? matched / pairs.length : 0
          });
        } else if (q.type === "ISIAN") {
          const userStr = (ans || "").toString().trim();
          const isBlank = userStr === "";
          const validKeys = (Array.isArray(q.correctAnswer) ? q.correctAnswer : [q.correctAnswer])
            .map((k) => String(k || "").trim().toLowerCase())
            .filter(Boolean);
          const isRight = !isBlank && validKeys.includes(userStr.toLowerCase());
          if (isBlank) blankCount++;
          else if (isRight) correctCount++;
          else wrongCount++;

          details.push({
            no: idx + 1,
            questionId: q.id,
            type: "ISIAN",
            text: q.text,
            studentAnswerText: !isBlank ? userStr : "(Kosong)",
            correctAnswerText: validKeys.join(" / "),
            status: isBlank ? "Kosong" : isRight ? "Benar" : "Salah",
            isCorrect: isRight,
            earned: isRight ? 1 : 0
          });
        }
      });

      const finalScore = (isSurveyPackage || questions.every((q) => q.type === "SURVEI"))
        ? totalScore
        : (questions.length > 0 ? Number(((correctCount / questions.length) * 100).toFixed(2)) : 0);

      return {
        score: finalScore,
        maxScore,
        correctCount,
        wrongCount,
        blankCount,
        totalQuestions: questions.length,
        details
      };
    }

    const TestEngine = ({ user, pkg, questions, onFinishExam }) => {
      const sessionId = `${user.id}_${pkg.id}`;
      const [orderedQuestions, setOrderedQuestions] = useState([]);
      const [matchingOptionsPool, setMatchingOptionsPool] = useState({});
      const [answers, setAnswers] = useState({});
      const [flags, setFlags] = useState({});
      const [currentIndex, setCurrentIndex] = useState(0);
      const [secondsLeft, setSecondsLeft] = useState(pkg.durationMinutes * 60);
      const [showGridModal, setShowGridModal] = useState(false);
      const [showConfirmFinish, setShowConfirmFinish] = useState(false);
      const [showTimeUpModal, setShowTimeUpModal] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const [ready, setReady] = useState(false);

      useEffect(() => {
        let mounted = true;
        (async () => {
          let session = await AsyncDB.get("sessions", sessionId);
          if (!session) {
            const qOrder = pkg.shuffleQuestions ? shuffleArray(questions.map((q) => q.id)) : questions.map((q) => q.id);
            const mPools = {};
            questions.forEach((q) => {
              if (q.type === "MENJODOHKAN" && Array.isArray(q.matchingPairs)) {
                mPools[q.id] = shuffleArray(q.matchingPairs.map((p) => p.right));
              }
            });
            session = {
              id: sessionId,
              userId: user.id,
              packageId: pkg.id,
              questionOrder: qOrder,
              matchingPools: mPools,
              answers: {},
              flags: {},
              endTime: Date.now() + pkg.durationMinutes * 60 * 1000,
              startedAt: Date.now()
            };
            await AsyncDB.put("sessions", session);
          }

          if (!mounted) return;
          const qMap = Object.fromEntries(questions.map((q) => [q.id, q]));
          const sorted = session.questionOrder.map((id) => qMap[id]).filter(Boolean);
          setOrderedQuestions(sorted.length ? sorted : questions);
          setMatchingOptionsPool(session.matchingPools || {});
          setAnswers(session.answers || {});
          setFlags(session.flags || {});
          const rem = Math.max(0, Math.floor((session.endTime - Date.now()) / 1000));
          setSecondsLeft(rem);
          setReady(true);
        })();
        return () => { mounted = false; };
      }, [sessionId]);

      useEffect(() => {
        const handleBeforeUnload = (e) => {
          e.preventDefault();
          e.returnValue = "";
        };
        window.addEventListener("beforeunload", handleBeforeUnload);
        return () => window.removeEventListener("beforeunload", handleBeforeUnload);
      }, []);

      const submitFinalResult = useCallback(async (latestAnswers) => {
        if (submitting) return;
        setSubmitting(true);
        const evalRes = evaluateExam(orderedQuestions, latestAnswers, pkg.category === "SURVEI");
        const resultRecord = {
          id: `${user.id}_${pkg.id}`,
          userId: user.id,
          userName: user.name,
          username: user.username,
          kelas: user.kelas || "-",
          packageId: pkg.id,
          packageTitle: pkg.title,
          packageCategory: pkg.category,
          submittedAt: new Date().toISOString(),
          ...evalRes
        };
        const syncRes = await CloudSync.saveItem("results", resultRecord);
        await AsyncDB.delete("sessions", sessionId);
        onFinishExam(resultRecord, syncRes.synced);
      }, [orderedQuestions, pkg, user, sessionId, submitting, onFinishExam]);

      useEffect(() => {
        if (!ready) return;
        if (secondsLeft <= 0) {
          setShowTimeUpModal(true);
          submitFinalResult(answers);
          return;
        }
        const timer = setInterval(() => {
          setSecondsLeft((prev) => {
            if (prev <= 1) {
              clearInterval(timer);
              setShowTimeUpModal(true);
              submitFinalResult(answers);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [ready, secondsLeft, answers, submitFinalResult]);

      const persistAnswer = async (qId, value) => {
        const updated = { ...answers, [qId]: value };
        setAnswers(updated);
        const session = await AsyncDB.get("sessions", sessionId);
        if (session) {
          session.answers = updated;
          await AsyncDB.put("sessions", session);

          await AsyncDB.put("sessions", session);
        }

                  <Icon name="clock" className="w-4 h-4" />
                  <span>{mins}:{secs}</span>
                </div>

                <button
                  onClick={() => setShowGridModal(true)}
                  className="lg:hidden flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold"
                >
                  <Icon name="grid" className="w-4 h-4" />
                  <span>{answeredCount}/{orderedQuestions.length}</span>
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 pb-24 lg:pb-8 grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-8 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-7 flex flex-col justify-between">
              <div>
                <div className="flex flex-wrap items-center justify-between gap-2 pb-4 mb-5 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <span className="px-3 py-1 rounded-lg bg-blue-700 text-white text-xs font-extrabold">
                      SOAL NO. {currentIndex + 1}
                    </span>
                    <span className="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-xs font-bold">
                      {currentQ.type === "PG" && "Pilihan Ganda"}
                      {currentQ.type === "PGK" && "Pilihan Ganda Kompleks"}
                      {currentQ.type === "MENJODOHKAN" && "Menjodohkan"}
                      {currentQ.type === "ISIAN" && "Isian Singkat"}

                    </span>

                  <button
                    onClick={() => toggleFlag(currentQ.id)}
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold border transition ${
                      flags[currentQ.id]
                        ? "bg-amber-500 border-amber-500 text-white"
                        : "bg-white border-slate-200 text-slate-600 hover:bg-amber-50"
                    }`}
                  >
                    <Icon name="flag" className="w-3.5 h-3.5" />
                    <span>{flags[currentQ.id] ? "Ragu-ragu Aktif" : "Ragu-ragu"}</span>
                  </button>
                </div>

                {currentQ.image && (
                  <div className="mb-5">
                    <img
                      src={currentQ.image}
                      alt="Ilustrasi Soal"
                      className="max-h-72 rounded-xl border border-slate-200 object-contain bg-slate-50"
                    />
                  </div>
                )}

                <div className="text-base sm:text-[17px] leading-relaxed text-slate-800 mb-6 whitespace-pre-line">
                  <MathText text={currentQ.text} />
                </div>

                {(currentQ.type === "PG" || currentQ.type === "SURVEI") && (
                  <div className="space-y-3">
                    {(currentQ.options || []).map((opt, idx) => {
                      const selected = answers[currentQ.id] === idx;
                      return (
                        <button
                          key={idx}
                          type="button"
                          onClick={() => persistAnswer(currentQ.id, idx)}
                          className={`w-full text-left p-4 rounded-xl border-2 transition flex items-start gap-3.5 ${
                            selected
                              ? "border-blue-600 bg-blue-50/70 shadow-sm"
                              : "border-slate-200 hover:border-blue-300 hover:bg-slate-50"
                          }`}
                        >
                          <span className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5 ${
                            selected ? "bg-blue-600 text-white" : "bg-slate-100 text-slate-700"
                          }`}>
                            {String.fromCharCode(65 + idx)}
                          </span>
                          <span className="text-sm sm:text-base text-slate-800 pt-0.5">
                            <MathText text={opt} />
                          </span>
                        </button>
                      );
                    })}
                  </div>
                )}

                {currentQ.type === "PGK" && (
                  <div className="space-y-3">
                    <p className="text-xs font-semibold text-blue-700 bg-blue-50 px-3 py-2 rounded-lg">
                      Pilih satu atau lebih jawaban yang dianggap benar.
                    </p>
                    {(currentQ.options || []).map((opt, idx) => {
                      const chosenList = Array.isArray(answers[currentQ.id]) ? answers[currentQ.id] : [];
                      const selected = chosenList.includes(idx);
                      const toggle = () => {
                        const next = selected ? chosenList.filter((i) => i !== idx) : [...chosenList, idx];
                        persistAnswer(currentQ.id, next);
                      };
                      return (
                        <button
                          key={idx}
                          type="button"
                          onClick={toggle}
                          className={`w-full text-left p-4 rounded-xl border-2 transition flex items-start gap-3.5 ${
                            selected
                              ? "border-blue-600 bg-blue-50/70 shadow-sm"
                              : "border-slate-200 hover:border-blue-300 hover:bg-slate-50"
                          }`}
                        >
                          <span className={`w-6 h-6 rounded-md flex items-center justify-center shrink-0 mt-0.5 border ${
                            selected ? "bg-blue-600 border-blue-600 text-white" : "bg-white border-slate-300"
                          }`}>
                            {selected && <Icon name="check" className="w-4 h-4" />}
                          </span>
                          <span className="text-sm sm:text-base text-slate-800">
                            <MathText text={opt} />
                          </span>
                        </button>
                      );
                    })}
                  </div>
                )}

                {currentQ.type === "MENJODOHKAN" && (
                  <div className="space-y-4">
                    <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                      <p className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
                        Pilihan Pasangan Jawaban:
                      </p>
                      <div className="flex flex-wrap gap-2">
                        {(matchingOptionsPool[currentQ.id] || (currentQ.matchingPairs || []).map((p) => p.right)).map((optVal, i) => (
                          <span key={i} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-sm font-medium text-slate-800">
                            <strong className="text-blue-700">{String.fromCharCode(65 + i)}.</strong>
                            <MathText text={optVal} />
                          </span>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-3">
                      {(currentQ.matchingPairs || []).map((pair, idx) => {
                        const currentMap = answers[currentQ.id] || {};
                        const pool = matchingOptionsPool[currentQ.id] || (currentQ.matchingPairs || []).map((p) => p.right);
                        return (
                          <div key={pair.id || idx} className="p-4 rounded-xl border border-slate-200 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div className="flex items-start gap-2.5 text-sm sm:text-base font-medium text-slate-800">
                              <span className="px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-xs font-bold mt-0.5">
                                {idx + 1}
                              </span>
                              <MathText text={pair.left} />
                            </div>

                            <select
                              value={currentMap[pair.id] || ""}
                              onChange={(e) => {
                                const nextMap = { ...currentMap, [pair.id]: e.target.value };
                                persistAnswer(currentQ.id, nextMap);
                              }}
                              className="sm:w-64 px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-600 text-sm font-semibold text-slate-800 outline-none"
                            >
                              <option value="">-- Pilih Pasangan --</option>
                              {pool.map((optVal, oIdx) => (
                                <option key={oIdx} value={optVal}>
                                  {String.fromCharCode(65 + oIdx)}. {optVal.replace(/\\\(|\\\)|\$/g, "")}
                                </option>
                              ))}
                            </select>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {currentQ.type === "ISIAN" && (
                  <div className="max-w-md">
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
                      Ketik Jawaban Singkat Anda:
                    </label>
                    <input
                      type="text"
                      value={answers[currentQ.id] || ""}
                      onChange={(e) => persistAnswer(currentQ.id, e.target.value)}
                      placeholder="Tulis jawaban di sini..."
                      className="w-full px-4 py-3 rounded-xl border-2 border-slate-300 focus:border-blue-600 outline-none text-base font-bold text-slate-900"
                    />
                  </div>
                )}
              </div>

              <div className="pt-6 mt-8 border-t border-slate-100 flex items-center justify-between gap-3">
                <button
                  type="button"
                  disabled={currentIndex === 0}
                  onClick={() => setCurrentIndex((i) => Math.max(0, i - 1))}
                  className="flex items-center gap-1.5 px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-bold text-sm hover:bg-slate-50 disabled:opacity-40"
                >
                  <Icon name="chevronLeft" className="w-4 h-4" />
                  <span>Sebelumnya</span>
                </button>

                {currentIndex < orderedQuestions.length - 1 ? (
                  <button
                    type="button"
                    onClick={() => setCurrentIndex((i) => Math.min(orderedQuestions.length - 1, i + 1))}
                    className="flex items-center gap-1.5 px-5 py-2.5 rounded-xl bg-blue-700 hover:bg-blue-800 text-white font-bold text-sm shadow-sm"
                  >
                    <span>Selanjutnya</span>
                    <Icon name="chevronRight" className="w-4 h-4" />
                  </button>
                ) : (
                  <button
                    type="button"
                    onClick={() => setShowConfirmFinish(true)}
                    className="flex items-center gap-1.5 px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-sm"
                  >
                    <Icon name="check" className="w-4 h-4" />
                    <span>Selesai Ujian</span>
                  </button>
                )}
              </div>
            </div>

            <aside className="hidden lg:flex lg:col-span-4 flex-col gap-4">
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-sm font-extrabold text-slate-800">Navigasi Nomor Soal</h3>
                  <span className="text-xs font-bold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-lg">
                    Terjawab: {answeredCount}/{orderedQuestions.length}
                  </span>
                </div>

                <div className="grid grid-cols-5 gap-2 max-h-80 overflow-y-auto pr-1">
                  {orderedQuestions.map((q, idx) => {
                    const active = idx === currentIndex;
                    const answered = isQuestionAnswered(q);
                    const flagged = flags[q.id];
                    let btnStyle = "bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200";
                    if (flagged) btnStyle = "bg-amber-400 text-slate-900 border-amber-500";
                    else if (answered) btnStyle = "bg-emerald-600 text-white border-emerald-600";
                    if (active) btnStyle += " ring-2 ring-blue-600 ring-offset-2";

                    return (
                      <button
                        key={q.id}
                        onClick={() => setCurrentIndex(idx)}
                        className={`h-10 rounded-xl border font-bold text-xs transition ${btnStyle}`}
                      >
                        {idx + 1}
                      </button>
                    );
                  })}
                </div>

                <div className="mt-5 pt-4 border-t border-slate-100 grid grid-cols-3 gap-2 text-[11px] font-semibold text-slate-600">
                  <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-emerald-600"></span> Dijawab</div>
                  <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-amber-400"></span> Ragu</div>
                  <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-slate-200"></span> Kosong</div>
                </div>

                <button
                  type="button"
                  onClick={() => setShowConfirmFinish(true)}
                  className="mt-5 w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow-md shadow-emerald-600/20 transition"
                >
                  Kumpulkan & Selesai Ujian
                </button>
              </div>
            </aside>
          </main>

          <div className="lg:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 p-3 flex items-center justify-between gap-2 z-30">
            <button
              onClick={() => setShowGridModal(true)}
              className="flex-1 py-2.5 px-3 rounded-xl bg-slate-100 text-slate-800 font-bold text-xs flex items-center justify-center gap-1.5"
            >
              <Icon name="grid" className="w-4 h-4" />
              <span>Daftar Soal ({answeredCount}/{orderedQuestions.length})</span>
            </button>
            <button
              onClick={() => setShowConfirmFinish(true)}
              className="flex-1 py-2.5 px-3 rounded-xl bg-emerald-600 text-white font-bold text-xs flex items-center justify-center gap-1.5"
            >
              <Icon name="check" className="w-4 h-4" />
              <span>Selesai Ujian</span>
            </button>
          </div>

          {showGridModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-extrabold text-slate-900">Pilih Nomor Soal</h3>
                  <button onClick={() => setShowGridModal(false)} className="p-1.5 rounded-lg bg-slate-100">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
                <div className="grid grid-cols-5 gap-2 max-h-72 overflow-y-auto">
                  {orderedQuestions.map((q, idx) => {
                    const answered = isQuestionAnswered(q);
                    const flagged = flags[q.id];
                    let cls = "bg-slate-100 text-slate-700";
                    if (flagged) cls = "bg-amber-400 text-slate-900";
                    else if (answered) cls = "bg-emerald-600 text-white";
                    if (idx === currentIndex) cls += " ring-2 ring-blue-600";
                    return (
                      <button
                        key={q.id}
                        onClick={() => { setCurrentIndex(idx); setShowGridModal(false); }}
                        className={`h-10 rounded-xl font-bold text-xs ${cls}`}
                      >
                        {idx + 1}
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {showConfirmFinish && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl">
                <h3 className="text-lg font-extrabold text-slate-900 mb-2">Konfirmasi Selesai Ujian</h3>
                <p className="text-sm text-slate-600 mb-4">
                  Anda telah menjawab <strong>{answeredCount}</strong> dari <strong>{orderedQuestions.length}</strong> soal.
                  {answeredCount < orderedQuestions.length && (
                    <span className="block mt-1 text-amber-700 font-semibold">
                      Masih ada {orderedQuestions.length - answeredCount} soal yang belum dijawab!
                    </span>
                  )}
                </p>
                <div className="flex gap-3 justify-end">
                  <button
                    onClick={() => setShowConfirmFinish(false)}
                    className="px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-bold text-sm"
                  >
                    Kembali Mengerjakan
                  </button>
                  <button
                    disabled={submitting}
                    onClick={() => submitFinalResult(answers)}
                    className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm"
                  >
                    {submitting ? "Mengirim ke Server..." : "Ya, Kumpulkan Jawaban"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {showTimeUpModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/75 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-2xl p-6 text-center shadow-2xl">
                <div className="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto mb-3">
                  <Icon name="clock" className="w-6 h-6" />
                </div>
                <h3 className="text-lg font-extrabold text-slate-900 mb-1">Waktu Ujian Habis</h3>
                <p className="text-sm text-slate-600">
                  Seluruh jawaban Anda otomatis disimpan dan dikumpulkan ke sistem.
                </p>
              </div>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // 9. DASHBOARD PESERTA
    // =========================================================================
    const StudentDashboard = ({ user, config, syncStatus, onRefreshSync, onLogout }) => {
      const [packages, setPackages] = useState([]);
      const [questions, setQuestions] = useState([]);
      const [results, setResults] = useState([]);
      const [sessions, setSessions] = useState([]);
      const [activeExam, setActiveExam] = useState(null);
      const [latestResult, setLatestResult] = useState(null);
      const [syncingNow, setSyncingNow] = useState(false);

      const loadLocal = async () => {
        const [pkgs, qs, res, sess] = await Promise.all([
          AsyncDB.getAll("packages"),
          AsyncDB.getAll("questions"),
          AsyncDB.getAll("results"),
          AsyncDB.getAll("sessions")
        ]);
        setPackages(pkgs.filter((p) => p.active));
        setQuestions(qs);
        setResults(res.filter((r) => String(r.userId) === String(user.id) || String(r.username) === String(user.username)));
        setSessions(sess.filter((s) => String(s.userId) === String(user.id)));
      };

      const handleManualSync = async () => {
        setSyncingNow(true);
        await onRefreshSync(false);
        await loadLocal();
        setSyncingNow(false);
      };

      useEffect(() => { loadLocal(); }, []);

      if (activeExam) {
        const pkgQuestions = questions.filter((q) => q.packageId === activeExam.id);
        return (
          <TestEngine
            user={user}
            pkg={activeExam}
            questions={pkgQuestions}
            onFinishExam={(res, synced) => {
              setActiveExam(null);
              setLatestResult({ ...res, cloudSynced: synced });
              loadLocal();
            }}
          />
        );
      }

      return (
        <div className="min-h-screen bg-slate-100">
          <header className="bg-blue-800 text-white px-4 py-4 shadow">
            <div className="max-w-5xl mx-auto flex items-center justify-between gap-4">
              <div>
                <p className="text-xs font-bold text-blue-200 uppercase">{config.schoolName}</p>
                <h1 className="text-lg font-extrabold">{config.appTitle}</h1>
              </div>
              <div className="flex items-center gap-2 sm:gap-3">
                <button
                  onClick={handleManualSync}
                  disabled={syncingNow}
                  className="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-blue-700 hover:bg-blue-600 text-xs font-bold"
                  title="Perbarui Soal dari Server"
                >
                  <Icon name="refresh" className={`w-4 h-4 ${syncingNow ? "animate-spin" : ""}`} />
                  <span className="hidden sm:inline">{syncingNow ? "Menyinkronkan..." : "Perbarui Soal"}</span>
                </button>
                <div className="text-right hidden sm:block">
                  <p className="text-sm font-bold">{user.name}</p>
                  <p className="text-xs text-blue-200">NISN: {user.username} • Kelas {user.kelas || "-"}</p>
                </div>
                <button
                  onClick={onLogout}
                  className="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-blue-900/70 hover:bg-blue-950 text-xs font-bold"
                >
                  <Icon name="logout" className="w-4 h-4" />
                  <span>Keluar</span>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto p-4 sm:p-6 space-y-6">
            {latestResult && (
              <div className="p-5 rounded-2xl bg-emerald-600 text-white shadow-lg flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div>
                  <span className="text-xs font-bold uppercase tracking-wider bg-emerald-700 px-2.5 py-1 rounded-lg">
                    {latestResult.cloudSynced ? "Terkirim ke Google Sheets" : "Tersimpan Lokal (Akan Terkirim Saat Online)"}
                  </span>
                  <h3 className="text-lg font-extrabold mt-2">{latestResult.packageTitle}</h3>
                  <p className="text-sm text-emerald-100">
                    {latestResult.packageCategory === "SURVEI"
                      ? `Total Skor Survei: ${latestResult.score} / ${latestResult.maxScore}`
                      : `Nilai Akhir: ${latestResult.score} (Benar: ${latestResult.correctCount}, Salah: ${latestResult.wrongCount}, Kosong: ${latestResult.blankCount})`}
                  </p>
                </div>
                <button
                  onClick={() => setLatestResult(null)}
                  className="px-4 py-2 rounded-xl bg-white text-emerald-700 font-bold text-xs"
                >
                  Tutup Info
                </button>
              </div>
            )}

            <div>
              <div className="flex items-center justify-between mb-3">
                <h2 className="text-base font-extrabold text-slate-800">Daftar Paket Try Out & Survei Aktif</h2>
                <span className="text-xs font-semibold text-slate-500">
                  Status: {syncStatus === "cloud" ? "Terhubung Cloud" : "Mode Lokal"}
                </span>
              </div>

              {packages.length === 0 ? (
                <div className="bg-white rounded-2xl p-8 text-center text-slate-500 border border-slate-200">
                  Belum ada paket ujian yang diaktifkan oleh Admin. Klik tombol <strong>Perbarui Soal</strong> di kanan atas jika Admin baru saja menambahkan paket.
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {packages.map((pkg) => {
                    const qCount = questions.filter((q) => q.packageId === pkg.id).length;
                    const doneRes = results.find((r) => r.packageId === pkg.id);
                    const ongoingSess = sessions.find((s) => s.packageId === pkg.id);

                    return (
                      <div key={pkg.id} className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
                        <div>
                          <div className="flex items-center justify-between gap-2 mb-2">
                            <span className={`px-2.5 py-1 rounded-lg text-xs font-extrabold ${
                              pkg.category === "SURVEI" ? "bg-purple-100 text-purple-700" : "bg-blue-100 text-blue-700"
                            }`}>
                              {pkg.category === "SURVEI" ? "SURVEI KARAKTER" : "TRY OUT TKA"}
                            </span>
                            <span className="text-xs font-bold text-slate-500">
                              {qCount} Soal • {pkg.durationMinutes} Menit
                            </span>
                          </div>
                          <h3 className="text-base font-extrabold text-slate-900 mb-1">{pkg.title}</h3>
                          <p className="text-xs text-slate-500 leading-relaxed mb-4">{pkg.description}</p>
                        </div>

                        {doneRes ? (
                          <div className="p-3 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center justify-between">
                            <div>
                              <p className="text-xs font-bold text-emerald-800">Sudah Dikerjakan</p>
                              <p className="text-xs text-emerald-600">
                                {pkg.category === "SURVEI" ? `Skor Total: ${doneRes.score}` : `Nilai: ${doneRes.score}`}
                              </p>
                            </div>
                            <span className="px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-xs font-bold">Selesai</span>
                          </div>
                        ) : (
                          <button
                            disabled={qCount === 0}
                            onClick={() => setActiveExam(pkg)}
                            className="w-full py-3 px-4 rounded-xl bg-blue-700 hover:bg-blue-800 disabled:bg-slate-300 text-white font-bold text-sm flex items-center justify-center gap-2 transition"
                          >
                            <Icon name="play" className="w-4 h-4" />
                            <span>{ongoingSess ? "Lanjutkan Ujian" : qCount === 0 ? "Soal Belum Tersedia" : "Mulai Kerjakan"}</span>
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </main>
        </div>
      );
    };

    // =========================================================================
    // 10. DASHBOARD ADMIN LENGKAP
    // =========================================================================
    const AdminDashboard = ({ user, config, syncStatus, onRefreshSync, onConfigUpdate, onLogout }) => {
      const [tab, setTab] = useState("packages");
      const [packages, setPackages] = useState([]);
      const [questions, setQuestions] = useState([]);
      const [users, setUsers] = useState([]);
      const [results, setResults] = useState([]);
      const [toast, setToast] = useState("");
      const [syncing, setSyncing] = useState(false);

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 3800);
      };

      const refreshLocal = async () => {
        const [pkgs, qs, us, res] = await Promise.all([
          AsyncDB.getAll("packages"),
          AsyncDB.getAll("questions"),
          AsyncDB.getAll("users"),
          AsyncDB.getAll("results")
        ]);
        setPackages(pkgs);
        setQuestions(qs);
        setUsers(us);
        setResults(res);
      };

      const syncWithCloud = async () => {
        setSyncing(true);
        const r = await onRefreshSync(false);
        await refreshLocal();
        setSyncing(false);
        if (r.synced) notify("Data berhasil disinkronkan dengan Google Sheets!");
        else notify("Menggunakan penyimpanan lokal (periksa koneksi internet Anda).");
      };

      useEffect(() => { refreshLocal(); }, []);

      // --- PAKET UJIAN ---
      const [pkgForm, setPkgForm] = useState({ id: "", title: "", category: "TKA", durationMinutes: 60, shuffleQuestions: true, active: true, description: "" });
      const [showPkgModal, setShowPkgModal] = useState(false);

      const savePackage = async (e) => {
        e.preventDefault();
        const item = {
          ...pkgForm,
          id: pkgForm.id || `pkg_${Date.now()}`,
          durationMinutes: Number(pkgForm.durationMinutes) || 60
        };
        setShowPkgModal(false);
        const res = await CloudSync.saveItem("packages", item);
        await refreshLocal();
        notify(res.synced ? "Paket ujian tersimpan & tersinkron ke Google Sheets!" : "Paket ujian tersimpan di lokal.");
      };

      // --- BANK SOAL ---
      const [selectedPkgId, setSelectedPkgId] = useState("");
      useEffect(() => {
        if (!selectedPkgId && packages.length > 0) setSelectedPkgId(packages[0].id);
      }, [packages, selectedPkgId]);

      const [showQModal, setShowQModal] = useState(false);
      const [qForm, setQForm] = useState({
        id: "",
        type: "PG",
        text: "",
        options: ["", "", "", "", ""],
        correctAnswer: [0],
        matchingPairs: [{ id: "m1", left: "", right: "" }, { id: "m2", left: "", right: "" }],
        surveyWeights: [4, 3, 2, 1],
        image: ""
      });

      const openNewQuestion = () => {
        const currentPkg = packages.find((p) => p.id === selectedPkgId);
        const defaultType = currentPkg?.category === "SURVEI" ? "SURVEI" : "PG";
        setQForm({
          id: "",
          type: defaultType,
          text: "",
          options: ["", "", "", ""],
          correctAnswer: defaultType === "ISIAN" ? [""] : [0],
          matchingPairs: [{ id: "m1", left: "", right: "" }, { id: "m2", left: "", right: "" }],
          surveyWeights: [4, 3, 2, 1],
          image: ""
        });
        setShowQModal(true);
      };

      const saveQuestion = async (e) => {
        e.preventDefault();
        if (!selectedPkgId) return;
        const cleanOptions = qForm.options.map((o) => o.trim()).filter((o, idx) => o !== "" || idx < 4);
        const item = {
          ...qForm,
          id: qForm.id || `q_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          packageId: selectedPkgId,
          options: ["PG", "PGK", "SURVEI"].includes(qForm.type) ? cleanOptions : [],
          matchingPairs: qForm.type === "MENJODOHKAN" ? qForm.matchingPairs.filter((p) => p.left.trim() || p.right.trim()) : []
        };
        setShowQModal(false);
        const res = await CloudSync.saveItem("questions", item);
        await refreshLocal();
        notify(res.synced ? "Soal tersimpan & tersinkron ke Google Sheets!" : "Soal tersimpan di lokal.");
      };

      const downloadQuestionTemplateCsv = () => {
        const headers = ["TIPE", "PERTANYAAN", "OPSI_A", "OPSI_B", "OPSI_C", "OPSI_D", "OPSI_E", "KUNCI_JAWABAN", "BOBOT_SURVEI"];
        const rows = [
          ["PG", "Hasil dari \\(2\\sqrt{3} + 5\\sqrt{3}\\) adalah ....", "\\(7\\sqrt{3}\\)", "\\(7\\sqrt{6}\\)", "\\(10\\sqrt{3}\\)", "\\(10\\sqrt{9}\\)", "", "A", ""],
          ["PGK", "Pilih dua bilangan prima di bawah ini!", "2", "4", "7", "9", "", "A|C", ""],
          ["MENJODOHKAN", "Pasangkan negara dan ibu kotanya!", "Indonesia=Jakarta | Jepang=Tokyo | Malaysia=Kuala Lumpur", "", "", "", "", "", ""],
          ["ISIAN", "Hasil dari \\(15 \\times 4\\) adalah ...", "", "", "", "", "", "60", ""],
          ["SURVEI", "Saya selalu menghargai pendapat teman saat berdiskusi.", "Sangat Setuju", "Setuju", "Kurang Setuju", "Tidak Setuju", "", "", "4|3|2|1"]
        ];
        const csvContent = "\uFEFF" + [headers, ...rows]
          .map((r) => r.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(","))
          .join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Template_Soal_TKA_SMPN5_Sajira.csv";
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportQuestionsCsv = (e) => {
        const file = e.target.files?.[0];
        if (!file || !selectedPkgId) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          const rows = parseCsvRows(ev.target.result);
          if (rows.length <= 1) {
            notify("File CSV kosong atau format tidak terbaca.");
            return;
          }
          const imported = [];
          for (let i = 1; i < rows.length; i++) {
            const cols = rows[i];
            const rawType = (cols[0] || "PG").toUpperCase().trim();
            const type = ["PG", "PGK", "MENJODOHKAN", "ISIAN", "SURVEI"].includes(rawType) ? rawType : "PG";
            const text = cols[1] || "";
            if (!text.trim()) continue;

            const opts = [cols[2], cols[3], cols[4], cols[5], cols[6]].map((o) => (o || "").trim()).filter(Boolean);
            const rawKey = (cols[7] || "").trim();
            const rawWeights = (cols[8] || "").trim();

            let correctAnswer = [];
            let matchingPairs = [];
            let surveyWeights = [];

            if (type === "PG") {
              const idxs = parseKeyIndices(rawKey);
              correctAnswer = [idxs.length ? idxs[0] : 0];
            } else if (type === "PGK") {
              correctAnswer = parseKeyIndices(rawKey);
            } else if (type === "ISIAN") {
              correctAnswer = rawKey.split("|").map((k) => k.trim()).filter(Boolean);
            } else if (type === "MENJODOHKAN") {
              const pairSource = rawKey || cols[2] || "";
              matchingPairs = pairSource
                .split("|")
                .map((p, pIdx) => {
                  const [left, right] = p.split("=");
                  return { id: `m_${i}_${pIdx}`, left: (left || "").trim(), right: (right || "").trim() };
                })
                .filter((p) => p.left && p.right);
            } else if (type === "SURVEI") {
              surveyWeights = rawWeights
                ? rawWeights.split(/[|,;\s]+/).map((w) => Number(w.trim()) || 0)
                : [4, 3, 2, 1];
            }

            imported.push({
              id: `q_csv_${Date.now()}_${i}`,
              packageId: selectedPkgId,
              type,
              text,
              options: ["PG", "PGK", "SURVEI"].includes(type) ? opts : [],
              correctAnswer,
              matchingPairs,
              surveyWeights,
              image: ""
            });
          }

          if (imported.length > 0) {
            notify(`Mengunggah ${imported.length} soal...`);
            const res = await CloudSync.saveBulk("questions", imported);
            await refreshLocal();
            notify(res.synced ? `${imported.length} soal berhasil diimpor & tersinkron ke Google Sheets!` : `${imported.length} soal tersimpan di lokal.`);
          } else {
            notify("Tidak ada baris soal valid yang ditemukan.");
          }
          e.target.value = "";
        };
        reader.readAsText(file);
      };

      // --- PESERTA ---
      const [userForm, setUserForm] = useState({ id: "", username: "", password: "123", name: "", kelas: "IX-A", role: "student" });
      const [showUserModal, setShowUserModal] = useState(false);

      const saveUser = async (e) => {
        e.preventDefault();
        setShowUserModal(false);
        const res = await CloudSync.saveItem("users", {
          ...userForm,
          id: userForm.id || `usr_${Date.now()}`
        });
        await refreshLocal();
        notify(res.synced ? "Data pengguna tersimpan & tersinkron ke Google Sheets!" : "Data pengguna tersimpan di lokal.");
      };

      const handleImportUsersCsv = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          const rows = parseCsvRows(ev.target.result);
          const imported = [];
          for (let i = 1; i < rows.length; i++) {
            const [nisn, nama, kelas, pass] = rows[i];
            if (!nisn || !nama) continue;
            imported.push({
              id: `stu_${nisn.trim()}`,
              username: nisn.trim(),
              name: nama.trim(),
              kelas: (kelas || "IX-A").trim(),
              password: (pass || "123").trim(),
              role: "student"
            });
          }
          if (imported.length > 0) {
            notify(`Mengunggah ${imported.length} peserta...`);
            const res = await CloudSync.saveBulk("users", imported);
            await refreshLocal();
            notify(res.synced ? `${imported.length} peserta diimpor & tersinkron ke Google Sheets!` : `${imported.length} peserta tersimpan di lokal.`);
          }
          e.target.value = "";
        };
        reader.readAsText(file);
      };

      // --- HASIL & ANALISIS ---
      const [filterResPkg, setFilterResPkg] = useState("ALL");
      const [detailModalResult, setDetailModalResult] = useState(null);

      const filteredResults = useMemo(() => {
        if (filterResPkg === "ALL") return results;
        return results.filter((r) => r.packageId === filterResPkg);
      }, [results, filterResPkg]);

      const exportResultsDetailCsv = () => {
        if (filteredResults.length === 0) {
          notify("Belum ada data hasil ujian untuk diekspor.");
          return;
        }
        const maxQ = Math.max(...filteredResults.map((r) => (r.details || []).length), 0);
        const qHeaders = Array.from({ length: maxQ }, (_, i) => `No_${i + 1}`);
        const headers = ["NISN", "Nama_Peserta", "Kelas", "Paket_Ujian", "Kategori", "Skor_Nilai", "Benar", "Salah", "Kosong", "Waktu_Selesai", ...qHeaders];

        const rows = filteredResults.map((r) => {
          const perQ = Array.from({ length: maxQ }, (_, idx) => {
            const d = (r.details || [])[idx];
            return d ? `${d.status} [${d.studentAnswerText}]` : "-";
          });
          return [
            r.username,
            r.userName,
            r.kelas,
            r.packageTitle,
            r.packageCategory,
            r.score,
            r.correctCount,
            r.wrongCount,
            r.blankCount,
            new Date(r.submittedAt).toLocaleString("id-ID"),
            ...perQ
          ];
        });

        const csvContent = "\uFEFF" + [headers, ...rows]
          .map((row) => row.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(","))
          .join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Rekap_Detail_Hasil_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      // --- PENGATURAN & KONEKSI GOOGLE SHEETS ---
      const [cfgForm, setCfgForm] = useState({
        schoolName: config.schoolName || "SMP NEGERI 5 SAJIRA",
        appTitle: config.appTitle || "TRY OUT TKA SMP",
        adminUsername: user.username,
        adminPassword: user.password,
        gasUrl: getGasUrl()
      });

      const saveSettings = async (e) => {
        e.preventDefault();
        setGasUrlStorage(cfgForm.gasUrl);
        const newCfg = { id: "app_config", schoolName: cfgForm.schoolName, appTitle: cfgForm.appTitle };
        await CloudSync.saveItem("settings", newCfg);
        await CloudSync.saveItem("users", { ...user, username: cfgForm.adminUsername, password: cfgForm.adminPassword });
        onConfigUpdate(newCfg);
        if (cfgForm.gasUrl) {
          await syncWithCloud();
        } else {
          notify("Pengaturan lokal berhasil disimpan.");
        }
      };

      const pushAllLocalToCloud = async () => {
        if (!getGasUrl()) {
          notify("Masukkan URL Web App Google Apps Script terlebih dahulu.");
          return;
        }
        setSyncing(true);
        const [u, p, q, r, s] = await Promise.all([
          AsyncDB.getAll("users"),
          AsyncDB.getAll("packages"),
          AsyncDB.getAll("questions"),
          AsyncDB.getAll("results"),
          AsyncDB.getAll("settings")
        ]);
        await Promise.all([
          u.length ? CloudSync.saveBulk("users", u) : Promise.resolve(),
          p.length ? CloudSync.saveBulk("packages", p) : Promise.resolve(),
          q.length ? CloudSync.saveBulk("questions", q) : Promise.resolve(),
          r.length ? CloudSync.saveBulk("results", r) : Promise.resolve(),
          s.length ? CloudSync.saveBulk("settings", s) : Promise.resolve()
        ]);
        await syncWithCloud();
        setSyncing(false);
        notify("Seluruh data lokal berhasil diunggah ke Google Sheets!");
      };

      const filteredQuestions = questions.filter((q) => q.packageId === selectedPkgId);

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col">
          <header className="bg-slate-900 text-white px-4 py-3.5 shadow-md">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              <div>
                <p className="text-[11px] font-bold tracking-wider uppercase text-blue-400">{config.schoolName}</p>
                <h1 className="text-base sm:text-lg font-extrabold">{config.appTitle} — Panel Admin</h1>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={syncWithCloud}
                  disabled={syncing}
                  className="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-blue-700 hover:bg-blue-600 text-xs font-bold transition"
                >
                  <Icon name="refresh" className={`w-4 h-4 ${syncing ? "animate-spin" : ""}`} />
                  <span className="hidden sm:inline">{syncing ? "Menyinkronkan..." : "Sinkronkan Cloud"}</span>
                </button>
                <button
                  onClick={onLogout}
                  className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-red-600 text-xs font-bold transition"
                >
                  <Icon name="logout" className="w-4 h-4" />
                  <span>Keluar</span>
                </button>
              </div>
            </div>
          </header>

          {toast && (
            <div className="fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl bg-slate-900 text-white text-sm font-semibold shadow-xl border border-slate-700">
              {toast}
            </div>
          )}

          <div className="bg-white border-b border-slate-200 px-4 overflow-x-auto">
            <div className="max-w-7xl mx-auto flex gap-1 sm:gap-2">
              {[
                { id: "packages", label: "Paket Ujian", icon: "folder" },
                { id: "questions", label: "Bank Soal", icon: "book" },
                { id: "users", label: "Peserta & Admin", icon: "users" },
                { id: "results", label: "Hasil & Analisis", icon: "chart" },
                { id: "settings", label: "Pengaturan & Cloud", icon: "settings" }
              ].map((t) => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`flex items-center gap-2 px-4 py-3.5 text-xs sm:text-sm font-bold border-b-2 whitespace-nowrap transition ${
                    tab === t.id
                      ? "border-blue-700 text-blue-700"
                      : "border-transparent text-slate-500 hover:text-slate-800"
                  }`}
                >
                  <Icon name={t.icon} className="w-4 h-4" />
                  <span>{t.label}</span>
                </button>
              ))}
            </div>
          </div>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            {/* TAB 1: PAKET UJIAN */}
            {tab === "packages" && (
              <div className="space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <h2 className="text-lg font-extrabold text-slate-900">Manajemen Paket Ujian & Survei</h2>
                  <button
                    onClick={() => {
                      setPkgForm({ id: "", title: "", category: "TKA", durationMinutes: 60, shuffleQuestions: true, active: true, description: "" });
                      setShowPkgModal(true);
                    }}
                    className="flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-blue-700 hover:bg-blue-800 text-white text-xs font-bold"
                  >
                    <Icon name="plus" className="w-4 h-4" />
                    <span>Tambah Paket Baru</span>
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {packages.map((p) => {
                    const count = questions.filter((q) => q.packageId === p.id).length;
                    return (
                      <div key={p.id} className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
                        <div>
                          <div className="flex items-center justify-between gap-2 mb-2">
                            <span className={`px-2.5 py-1 rounded-lg text-xs font-extrabold ${p.category === "SURVEI" ? "bg-purple-100 text-purple-700" : "bg-blue-100 text-blue-700"}`}>
                              {p.category}
                            </span>
                            <span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${p.active ? "bg-emerald-100 text-emerald-700" : "bg-slate-100 text-slate-500"}`}>
                              {p.active ? "Aktif" : "Nonaktif"}
                            </span>
                          </div>
                          <h3 className="text-base font-extrabold text-slate-900">{p.title}</h3>
                          <p className="text-xs text-slate-500 mt-1 mb-3">{p.description}</p>
                          <p className="text-xs font-bold text-slate-700">
                            Jumlah Soal: {count} • Durasi: {p.durationMinutes} Menit • Acak Soal: {p.shuffleQuestions ? "Ya" : "Tidak"}
                          </p>
                        </div>

                        <div className="mt-4 pt-3 border-t border-slate-100 flex items-center gap-2">
                          <button
                            onClick={() => { setSelectedPkgId(p.id); setTab("questions"); }}
                            className="flex-1 py-2 px-3 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-bold"
                          >
                            Kelola Soal ({count})
                          </button>
                          <button
                            onClick={() => { setPkgForm(p); setShowPkgModal(true); }}
                            className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700"
                          >
                            <Icon name="edit" className="w-4 h-4" />
                          </button>
                          <button
                            onClick={async () => {
                              await CloudSync.removeItem("packages", p.id);
                              await refreshLocal();
                              notify("Paket ujian dihapus.");
                            }}
                            className="p-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-600"
                          >
                            <Icon name="trash" className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 2: BANK SOAL */}
            {tab === "questions" && (
              <div className="space-y-4">
                <div className="bg-white rounded-2xl p-4 border border-slate-200 flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                  <div className="flex flex-col sm:flex-row sm:items-center gap-2">
                    <label className="text-xs font-extrabold uppercase text-slate-500">Pilih Paket:</label>
                    <select
                      value={selectedPkgId}
                      onChange={(e) => setSelectedPkgId(e.target.value)}
                      className="px-3.5 py-2 rounded-xl border border-slate-300 text-sm font-bold text-slate-800 bg-slate-50"
                    >
                      {packages.map((p) => (
                        <option key={p.id} value={p.id}>{p.title} ({p.category})</option>
                      ))}
                    </select>
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    <button
                      onClick={downloadQuestionTemplateCsv}
                      className="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold"
                    >
                      <Icon name="download" className="w-4 h-4" />
                      <span>Template CSV</span>
                    </button>

                    <label className="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold cursor-pointer">

                      <input type="file" accept=".csv" onChange={handleImportQuestionsCsv} className="hidden" />
                    </label>

                    <button
                      onClick={openNewQuestion}

                    >
                      <Icon name="plus" className="w-4 h-4" />
                      <span>Tambah Soal</span>
                    </button>
                  </div>
                </div>

                <div className="space-y-3">
                  {filteredQuestions.length === 0 ? (
